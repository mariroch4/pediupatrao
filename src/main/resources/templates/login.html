<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login - Pediu Patrão</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            background-color: #f6f7f9;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            border-radius: 1rem;
            background-color: #ffffff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        }
        .logo {
            width: 110px;
            height: auto;
            margin-bottom: 0.5rem;
        }
        .marca {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 1.8rem;
            color: #23272f;
        }
        .btn-entrar {
            background-color: #ffc107;
            border-color: #ffc107;
            color: #23272f;
            font-weight: 600;
        }
        .btn-entrar:hover {
            background-color: #e0a800;
            border-color: #e0a800;
            color: #23272f;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card text-center">
            <img th:src="@{/images/logo.png}" alt="Logo Pediu Patrão" class="logo">
            <div class="marca mb-1">Pediu Patrão</div>
            <p class="text-muted mb-4">Entre com seu usuário e senha</p>

            <!-- Mensagens -->
            <div class="alert alert-danger py-2 small" th:if="${param.error}" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> Usuário ou senha inválidos.
            </div>
            <div class="alert alert-success py-2 small" th:if="${param.logout}" role="alert">
                <i class="bi bi-check-circle-fill me-1"></i> Você saiu do sistema.
            </div>

            <!-- Formulário de Login (th:action inclui o token CSRF automaticamente) -->
            <form th:action="@{/login}" method="post" class="text-start">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Digite seu nome de usuário" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Digite sua senha" autocomplete="current-password" required>
                        <button type="button" class="btn btn-outline-secondary" id="toggleSenha"
                                title="Mostrar senha" aria-label="Mostrar senha">
                            <i class="bi bi-eye" id="iconeSenha"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-entrar w-100">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                </button>
            </form>

            <!-- Esqueceu a senha -->
            <div class="mt-3">
                <a href="#" class="text-decoration-none small" id="linkEsqueci">Esqueceu sua senha?</a>
            </div>
            <div class="alert alert-info small text-start mt-2 mb-0 d-none" id="avisoEsqueci" role="alert">
                <i class="bi bi-info-circle-fill me-1"></i>
                Por segurança, a redefinição de senha é feita pelo <strong>administrador do sistema</strong>.
                Procure o responsável pela pizzaria para cadastrar uma nova senha.
            </div>
        </div>
    </div>

    <script>
        // Mostrar/ocultar a senha
        document.getElementById('toggleSenha').addEventListener('click', function () {
            const campo = document.getElementById('password');
            const icone = document.getElementById('iconeSenha');
            const mostrar = campo.type === 'password';
            campo.type = mostrar ? 'text' : 'password';
            icone.classList.toggle('bi-eye', !mostrar);
            icone.classList.toggle('bi-eye-slash', mostrar);
            this.title = mostrar ? 'Ocultar senha' : 'Mostrar senha';
            this.setAttribute('aria-label', this.title);
        });

        // Mostrar/ocultar o aviso de "Esqueceu sua senha?"
        document.getElementById('linkEsqueci').addEventListener('click', function (evento) {
            evento.preventDefault();
            document.getElementById('avisoEsqueci').classList.toggle('d-none');
        });
    </script>
</body>
</html>
