<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">

        <title>Pediu Patrão - Sistema de Pedidos</title>
        <link rel="icon" type="image/png" th:href="@{/images/logo.png}">

        <!-- Fontes: Fredoka (marca) e Poppins (menu) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">

        <script>

            (function () {
                const tokenMeta = document.querySelector('meta[name="_csrf"]');
                const headerMeta = document.querySelector('meta[name="_csrf_header"]');
                if (!tokenMeta || !headerMeta) {
                    return;
                }
                const token = tokenMeta.content;
                const header = headerMeta.content;
                const fetchOriginal = window.fetch;

                window.fetch = function (input, init) {
                    init = init || {};
                    const url = (typeof input === 'string') ? input : input.url;
                    const metodo = (init.method || (input instanceof Request ? input.method : 'GET')).toUpperCase();
                    const mesmaOrigem = new URL(url, window.location.href).origin === window.location.origin;

                    if (mesmaOrigem && !['GET', 'HEAD', 'OPTIONS', 'TRACE'].includes(metodo)) {
                        const headers = new Headers(init.headers || {});
                        headers.set(header, token);
                        init.headers = headers;
                    }
                    return fetchOriginal.call(this, input, init);
                };
            })();
        </script>
    </head>
    <body>

        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <main class="container-fluid mt-4">
            <div th:replace="~{__${content}__}"></div>
        </main>

        <script th:src="@{/js/paginacao.js}"></script>
        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
