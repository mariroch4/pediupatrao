<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cliente</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/clientes}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person-raised-hand me-2"></i><span
                th:text="${cliente.id != null} ? 'Editar Cliente' : 'Novo Cliente'"></span>
        </h2>
    </div>

    <!-- Erro de validação vindo do servidor -->
    <div class="alert alert-danger" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
    </div>

    <form th:action="${cliente.id != null}
                ? @{/clientes/editar/{id}(id=${cliente.id})}
                : @{/clientes/salvar}"
          th:object="${cliente}"
          method="post">

        <div class="row g-4">

            <!-- Dados do cliente -->
            <div class="col-lg-5">
                <div class="card shadow-sm h-100">
                    <div class="card-header fw-bold"><i class="bi bi-person me-1"></i> Dados do cliente</div>
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label for="nome" class="form-label fw-medium">Nome</label>
                            <input type="text" id="nome" class="form-control" th:field="*{nome}"
                                   placeholder="Ex: João da Silva" maxlength="100" required/>
                        </div>
                        <div class="mb-0">
                            <label for="telefone" class="form-label fw-medium">Telefone</label>
                            <input type="text" id="telefone" class="form-control" th:field="*{telefone}"
                                   placeholder="Ex: (11) 99999-9999" maxlength="15" required/>
                            <div class="form-text">DDD + número (10 ou 11 dígitos).</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Endereço -->
            <div class="col-lg-7">
                <div class="card shadow-sm h-100">
                    <div class="card-header fw-bold"><i class="bi bi-geo-alt me-1"></i> Endereço</div>
                    <div class="card-body p-4">
                        <div class="row g-3">
                            <div class="col-md-5">
                                <label for="cep" class="form-label fw-medium">CEP</label>
                                <div class="input-group">
                                    <input type="text" id="cep" class="form-control" th:field="*{cep}"
                                           placeholder="Ex: 01310-100" maxlength="9"/>
                                    <button type="button" class="btn btn-outline-secondary" id="btnBuscarCep">
                                        <i class="bi bi-search"></i>
                                    </button>
                                </div>
                                <div id="cepErro" class="text-danger small mt-1" style="display:none;">
                                    CEP não encontrado.
                                </div>
                            </div>
                            <div class="col-md-7">
                                <label for="logradouro" class="form-label fw-medium">Logradouro</label>
                                <input type="text" id="logradouro" class="form-control" th:field="*{logradouro}"
                                       placeholder="Ex: Rua das Flores" maxlength="100"/>
                            </div>
                            <div class="col-md-3">
                                <label for="numero" class="form-label fw-medium">Número</label>
                                <input type="text" id="numero" class="form-control" th:field="*{numero}"
                                       placeholder="Ex: 123" maxlength="20"/>
                            </div>
                            <div class="col-md-9">
                                <label for="complemento" class="form-label fw-medium">Complemento</label>
                                <input type="text" id="complemento" class="form-control" th:field="*{complemento}"
                                       placeholder="Ex: Apto 42" maxlength="100"/>
                            </div>
                            <div class="col-md-5">
                                <label for="bairro" class="form-label fw-medium">Bairro</label>
                                <input type="text" id="bairro" class="form-control" th:field="*{bairro}"
                                       placeholder="Ex: Centro" maxlength="100"/>
                            </div>
                            <div class="col-md-5">
                                <label for="cidade" class="form-label fw-medium">Cidade</label>
                                <input type="text" id="cidade" class="form-control" th:field="*{cidade}"
                                       placeholder="Ex: São Paulo" maxlength="100"/>
                            </div>
                            <div class="col-md-2">
                                <label for="estado" class="form-label fw-medium">UF</label>
                                <input type="text" id="estado" class="form-control" th:field="*{estado}"
                                       placeholder="SP" maxlength="2"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Botões -->
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i>
                <span th:text="${cliente.id != null} ? 'Salvar Alterações' : 'Criar Cliente'"></span>
            </button>
            <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>

    <script>
        document.getElementById('cep').addEventListener('input', function () {
            let v = this.value.replace(/\D/g, '');
            if (v.length > 5) v = v.slice(0, 5) + '-' + v.slice(5, 8);
            this.value = v;
            if (this.value.length === 9) buscarCep();
        });

        document.getElementById('btnBuscarCep').addEventListener('click', buscarCep);

        async function buscarCep() {
            const cep = document.getElementById('cep').value.replace(/\D/g, '');
            const erro = document.getElementById('cepErro');
            erro.style.display = 'none';
            if (cep.length !== 8) return;

            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();
                if (data.erro) {
                    erro.style.display = 'block';
                    return;
                }
                document.getElementById('logradouro').value = data.logradouro || '';
                document.getElementById('bairro').value = data.bairro || '';
                document.getElementById('cidade').value = data.localidade || '';
                document.getElementById('estado').value = data.uf || '';
                document.getElementById('numero').focus();
            } catch (e) {
                erro.textContent = 'Erro ao buscar o CEP. Tente novamente.';
                erro.style.display = 'block';
            }
        }

        document.getElementById('telefone').addEventListener('input', function () {
            let v = this.value.replace(/\D/g, '');
            if (v.length <= 10) {
                v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
            } else {
                v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
            }
            this.value = v;
        });
    </script>

</div>

</body>
</html>
