<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
    </head>
    <body>
        <div th:fragment="sidebar">
            <div id="sidebar">

                <!-- Logo + nome do sistema -->
                <a th:href="@{/}" class="sidebar-marca">
                    <img th:src="@{/images/logo.png}" alt="Logo Pediu Patrão">
                    <span>Pediu Patrão</span>
                </a>

                <nav class="sidebar-nav">
                    <div class="sidebar-secao">Operação</div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}">
                                <i class="bi bi-house"></i><span>Home</span>
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyRole('GERENTE', 'ATENDENTE')">
                            <a class="nav-link" th:href="@{/clientes}">
                                <i class="bi bi-person-raised-hand"></i><span>Clientes</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/pedidos}">
                                <i class="bi bi-bag"></i><span>Pedidos</span>
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyRole('GERENTE', 'ATENDENTE')">
                            <a class="nav-link" th:href="@{/pedidos/novo}">
                                <i class="bi bi-bag-plus"></i><span>Novo Pedido</span>
                            </a>
                        </li>
                    </ul>

                    <div class="sidebar-secao">Gestão</div>
                    <ul class="nav flex-column">
                        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'GERENTE')">
                            <a class="nav-link" th:href="@{/auditoria}">
                                <i class="bi bi-shield-lock"></i><span>Auditoria</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/produtos}">
                                <i class="bi bi-boxes"></i><span>Produtos</span>
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                            <a class="nav-link" th:href="@{/usuarios}">
                                <i class="bi bi-people-fill"></i><span>Usuários</span>
                            </a>
                        </li>
                    </ul>
                </nav>

                <!-- Usuário logado -->
                <div class="sidebar-usuario" sec:authorize="isAuthenticated()">
                    <div class="avatar"
                         th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">A</div>
                    <div class="info">
                        <div class="rotulo">Conectado como</div>
                        <div class="nome" sec:authentication="name">usuario</div>
                        <span class="badge bg-warning text-dark perfil"
                              th:each="auth : ${#authentication.authorities}"
                              th:text="${#strings.replace(auth.authority, 'ROLE_', '')}">PERFIL</span>
                    </div>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn-sair" title="Sair do sistema">
                            <i class="bi bi-box-arrow-right"></i>
                        </button>
                    </form>
                </div>

            </div>

            <script>
                (function () {
                    const caminho = window.location.pathname;
                    let melhorLink = null;
                    let maiorTamanho = -1;
                    document.querySelectorAll('#sidebar .nav-link').forEach(function (link) {
                        const href = link.getAttribute('href');
                        if (!href) {
                            return;
                        }
                        const confere = href === '/'
                                ? caminho === '/'
                                : (caminho === href || caminho.startsWith(href + '/'));
                        if (confere && href.length > maiorTamanho) {
                            melhorLink = link;
                            maiorTamanho = href.length;
                        }
                    });
                    if (melhorLink) {
                        melhorLink.classList.add('ativo');
                    }
                })();
            </script>
        </div>
    </body>
</html>
